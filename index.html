<!doctype html>
<html lang="en">
  <head>
    <!-- =======================
         BASIC META
    ======================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Asumbi TTC Smart Campus</title>

    <!-- =======================
         THEME COLOR (mobile UI)
    ======================== -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- =======================
         ICON
    ======================== -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- =======================
         GOOGLE FONT (modern UI)
    ======================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =======================
         GLOBAL STYLE (fallback if Tailwind fails)
    ======================== -->
    <style>
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background: radial-gradient(circle at top, #111827, #0a0f1c, #050814);
        color: white;
      }

      #root {
        min-height: 100vh;
      }

      /* loading screen feel */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        font-weight: 600;
        letter-spacing: 1px;
      }
    </style>
  </head>

  <body>
    <!-- optional loading splash -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
